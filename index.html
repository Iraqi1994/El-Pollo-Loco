<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="./img/favicon/sombrero_favicon.png" />

    <!-- Base classes first -->
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>

    <!-- Child classes that extend MovableObject or DrawableObject -->
    <script src="models/statusbar.class.js"></script>
    <script src="models/healthbar.class.js"></script>
    <script src="models/coinbar.class.js"></script>
    <script src="models/salsabar.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/chick.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/throwable-object.class.js"></script>

    <!-- Level and utilities -->
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="levels/level1.js"></script>

    <!-- World and game initialization (depends on level1) -->
    <script src="models/world.class.js"></script>
    <script src="scripts/game.js"></script>
  </head>
  <body>
    <h1>El Pollo Loco</h1>

    <!-- Start Screen -->
    <div id="startScreen" class="start-screen">
      <div class="start-content">
        <h2>Welcome to El Pollo Loco!</h2>
        <img src="./img/startscreen/start_game_new.svg" alt="Start Game" id="startButton" class="start-button" />
        <div class="instructions">
          <h3>How to Play:</h3>
          <p><strong>← →</strong> Move left/right</p>
          <p><strong>SPACE</strong> Jump</p>
          <p><strong>D</strong> Throw bottle</p>
          <p>Collect coins and bottles, defeat chickens, and beat the boss!</p>
        </div>
      </div>
    </div>

    <canvas id="canvas" width="720" height="480" style="display: none"></canvas>
  </body>
</html>
